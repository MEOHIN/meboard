<html layout:decorate="~{layout}">
    <div layout:fragment="content" class="rootContainer">
        <div>
            <h4>회원가입</h4>
        </div>
        <form method="post" th:action="@{/user/register}" th:object="${userVO}">
            <div th:replace="~{form_errors :: formErrorsFragment}"></div>
                <div>
                <label for="username">아이디</label>
                <input type="email" id="username" th:field="*{username}">
            </div>
            <div>
                <label for="password1">비밀번호</label>
                <input type="password" id="password1" th:field="*{password1}">
            </div>
            <div>
                <label for="password2">비밀번호 확인</label>
                <input type="password" id="password2" th:field="*{password2}">
            </div>
            <div>
                <label for="nickname">닉네임</label>
                <input type="text" id="nickname" th:field="*{nickname}">
            </div>
            <button type="submit">회원가입</button>
        </form>
    </div>
</html>
