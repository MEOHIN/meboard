<!-- layout.html 템플릿 상속 -->
<html layout:decorate="~{layout}">
    <!-- 부모 템플릿 th:block 엘리먼트 내용을 자식 템플릿의 div 엘리먼트 내용으로 교체 -->
    <div layout:fragment="content" class="rootContainer">
        <div class="mainContainer">
            <table>
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성일</th>
                        <th>조회수</th>
                        <th>추천수</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="post : ${postList}">
                        <td th:text="${post.postNo}"></td>
                        <td>
                            <a th:href="@{'/post/view/' + ${post.postNo}}">
                                <span th:text="${post.title}"></span>
                            </a>
                        </td>
                        <td th:text="${post.writer}"></td>
                        <td th:text="${#dates.format(post.regDate, 'yyyy-MM-dd')}"></td>
                        <td th:text="${post.viewCnt}"></td>
                        <td th:text="${post.likeCnt}"></td>
                    </tr>
            </table>
        </div>
    </div>
</html>
