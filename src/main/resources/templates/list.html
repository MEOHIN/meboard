<!-- layout.html 템플릿 상속 -->
<html layout:decorate="~{layout}">
    <!-- 부모 템플릿 th:block 엘리먼트 내용을 자식 템플릿의 div 엘리먼트 내용으로 교체 -->
    <div layout:fragment="content" class="rootContainer">
        <div>
            <a th:href="@{/post/write}">글쓰기</a>
        </div>
        <div>
            <form method="get" th:action="@{/post/search}" >
                <input type="text" name="keyword" placeholder="검색어를 입력하세요">
                <input type="submit" value="검색">
            </form>
        </div>
        <div class="mainContainer">
            <div th:if="${message} != null">
                <span th:text="${message}">
            </div>
            <div th:if="${message} == null">
            <table>
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성일</th>
                        <th>조회수</th>
                        <th>추천수</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="post : ${postList}">
                        <td th:text="${post.id}"></td>
                        <td>
                            <a th:href="@{'/post/' + ${post.id}}">
                                <span th:text="${post.title}"></span>
                            </a>
                        </td>
                        <td th:text="${post.author.nickname}"></td>
                        <td th:text="${post.createdAt}"></td>
                        <td th:text="${post.viewCount}"></td>
                        <td th:text="${post.likeCount}"></td>
                    </tr>
            </table>
            </div>
        </div>
    </div>
</html>
