<!-- layout.html 템플릿 상속 -->
<html layout:decorate="~{layout}">
    <!-- 부모 템플릿 th:block 엘리먼트 내용을 자식 템플릿의 div 엘리먼트 내용으로 교체 -->
    <div layout:fragment="content" class="rootContainer">
        <!-- 검색바 -->
        <div class="nav-wrapper">
            <form method="get" th:action="@{/post/search}" >
                <div class="input-field">
                    <input id="search" type="search" name="keyword" placeholder="검색어를 입력하세요" required>
                    <label class="label-icon" for="search"><i class="material-icons">search</i></label>
                    <!-- TODO: 검색버튼 숨기기 -->
                    <input type="submit" value="검색">
                    <i class="material-icons">close</i>
                </div>
            </form>
        </div>
        <!-- 새 게시글 등록 -->
        <div>
            <a th:href="@{/post/write}">글쓰기</a>
        </div>
        <!-- 게시글 목록 -->
        <div class="mainContainer">
            <div th:if="${message} != null">
                <span th:text="${message}"></span>
            </div>
            <div th:if="${message} == null">
            <table>
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>작성일</th>
                        <th>조회수</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="post : ${postList}">
                        <td th:text="${post.id}"></td>
                        <td>
                            <a th:href="@{'/post/' + ${post.id}}">
                                <span th:text="${post.title}"></span>
                            </a>
                            <!-- 댓글 게수 표시 -->
                            <span th:if="${#lists.size(post.replies) > 0}" th:text="'[' + ${#lists.size(post.replies)} + ']'"></span>
                        </td>
                        <td th:text="${post.author.nickname}"></td>
                        <td th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></td>
                        <td th:text="${post.viewCount}"></td>
                    </tr>
            </table>
            </div>
        </div>
    </div>
</html>
