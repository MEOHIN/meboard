<html layout:decorate="~{layout}">
    <div layout:fragment="content" class="rootContainer">
        <div class="mainContainer">
            <div th:if="${post.author.username == #authentication.name}"  class="post-controls">
                <a th:href="@{'/post/' + ${post.id} + '/modify'}">수정</a>             
                <form method="post" th:action="@{'/post/' + ${post.id} + '/delete'}">
                    <input type="submit" value="삭제">
                </form>
            </div>
            <a th:href="@{'/post/list'}">목록</a>

            <!-- 게시판 데이터 -->
            <div class="post-metadata">
                <span th:text="${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></span>
                <span th:text="'조회 ' + ${post.viewCount?:0}"></span>
                <span th:text="'댓글 ' + ${post.replyCount?:0}"></span>
            </div>

            <!-- 게시글 제목/내용 -->
            <div class="post-content">
                <h3 th:text="${post.title}"></h3>
                <div th:text="${post.content}"></div>
            </div>

            <!-- 댓글 폼 (작성용) -->
            <div class="reply-form">
                <form method="post" th:action="@{'/post/' + ${post.id} + '/reply'}" >
                    <textarea name="content" placeholder="댓글을 입력하세요."></textarea>
                    <input type="submit" value="등록">
                </form>
            </div>

            <!-- 댓글 목록 -->
            <div class="reply-list">
                <div th:each="reply : ${replyList}" class="reply-item">
                    <div class="reply-content">
                        <span th:text="${reply.author.nickname}" class="author"></span>
                        <span th:text="${reply.content}"></span>
                        <span th:text="${#temporals.format(reply.createdAt, 'yyyy-MM-dd HH:mm')}" class="date"></span>
                    </div>
                    
                    <!-- 댓글 폼 (수정용) -->
                    <div class="reply-form" sec:authorize="isAuthenticated()" 
                         th:if="${reply.author != null and reply.author.username == #authentication.name}">
                        <form method="post" th:action="@{'/post/' + ${post.id} + '/reply/' + ${reply.id} + '/modify'}">
                            <!-- 수정하려는 댓글의 기존 내용을 폼에 미리 채웁니다 -->
                            <input type="text" name="content" th:value="${reply.content}" placeholder="댓글을 수정하세요" />
                            <input type="submit" value="수정">
                        </form>
                    </div>
                    
                    <!-- 댓글 액션 - 작성자만 볼 수 있도록 -->
                    <div class="reply-actions" sec:authorize="isAuthenticated()" 
                         th:if="${reply.author != null and reply.author.username == #authentication.name}">                 
                        <form method="post" th:action="@{'/post/' + ${post.id} + '/reply/' + ${reply.id} + '/delete'}">
                            <button type="submit">삭제</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</html>
