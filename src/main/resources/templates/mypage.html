<html layout:decorate="~{layout}">
    <div layout:fragment="content" class="container">
        <div class="row">
            <div class="col s12">
                <h4>회원정보 수정</h4>
            </div>
        </div>
        
        <div class="row">
            <form class="col s12" method="post" th:action="@{/user/mypage}" th:object="${userVO}">
                <div th:replace="~{form_errors :: formErrorsFragment}"></div>
                
                <!-- 이메일(아이디) 필드 -->
                <div class="row">
                    <div class="input-field col s12">
                        <input type="email" id="username" th:field="*{username}" disabled>
                        <label for="username" class="active">아이디(이메일)</label>
                    </div>
                </div>

                <!-- 닉네임 수정 섹션 -->
                <div class="row">
                    <div class="input-field col s12">
                        <input type="text" id="nickname" th:field="*{nickname}">
                        <label for="nickname" class="active">닉네임</label>
                        <button class="btn waves-effect waves-light" type="submit" name="action" value="updateNickname">
                            닉네임 수정
                        </button>
                    </div>
                </div>

                <!-- 비밀번호 수정 섹션 -->
                <div class="row">
                    <div class="col s12">
                        <span>비밀번호 변경</span>
                        <div class="input-field">
                            <input type="password" id="currentPassword" name="currentPassword">
                            <label for="currentPassword">현재 비밀번호</label>
                        </div>
                        <div class="input-field">
                            <input type="password" id="newPassword1" name="newPassword1">
                            <label for="newPassword1">새 비밀번호</label>
                        </div>
                        <div class="input-field">
                            <input type="password" id="newPassword2" name="newPassword2">
                            <label for="newPassword2">새 비밀번호 확인</label>
                        </div>
                        <button class="btn waves-effect waves-light" type="submit" name="action" value="updatePassword">
                            비밀번호 변경
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</html>
